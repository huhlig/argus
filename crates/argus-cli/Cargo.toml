[package]
name = "argus-cli"
description = "Command-line interface for Argus source intelligence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
argus-core = { path = "../argus-core" }
argus-evidence = { path = "../argus-evidence" }
argus-language = { path = "../argus-language" }
argus-policies = { path = "../argus-policies" }
argus-provider = { path = "../argus-provider" }
argus-report = { path = "../argus-report" }
argus-rust = { path = "../argus-rust" }
argus-snapshot = { path = "../argus-snapshot" }
argus-storage = { path = "../argus-storage" }
argus-workflow = { path = "../argus-workflow" }
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true

[dev-dependencies]
argus-test-support = { path = "../argus-test-support" }
tempfile.workspace = true

[lints]
workspace = true
